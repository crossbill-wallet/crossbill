# When a release is published, builds an unsigned .ipa from its tag and attaches it to the release, with its
# SHA-256 and a GitHub build provenance attestation, so testers can check the file was built by GitHub from that
# public commit. Nothing is signed: no certificate, team or name is in it. Testers sign it with their own Apple
# Account (see TESTERS.md). Run it by hand for an existing release with "Run workflow" and the tag.
#
# Actions are pinned to full commits, with the release they are in a comment.

name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.4.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Xcode 26.6 on the macOS 26 runner. Switch to the xcode-27 runner once it leaves preview.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Check the tag is this version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "package.json says $version, but the tag is $TAG" >&2
            exit 1
          fi
      - run: npm ci
      - name: Build an unsigned .ipa
        run: bash scripts/build-ios-unsigned.sh build/ios
      - name: Attest where it came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/ios/*.ipa
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/ios/*.ipa build/ios/*.ipa.sha256 --clobber --repo "$GITHUB_REPOSITORY"
