<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Everything ships inside the app: no remote scripts, styles, fonts or images, and no network calls
         from the page itself. Node traffic goes through the native plugin, not fetch. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' capacitor: ionic:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' capacitor: ionic: http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Shrike</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
